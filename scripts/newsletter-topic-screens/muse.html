<!doctype html>
<!-- L · Muse: the screen shows one long task worked through while the app was closed, ending on a request for an OK.
     A stand-in drawn for the prototype, not Meta's interface; the issue would use a screenshot from Zev's own setup. -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 940px; background: #F6F3EC; color: #1C2B39; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; padding: 64px 76px; }
  h1 { font-size: 56px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { margin: 10px 0 40px; font-size: 30px; color: #6B7785; }
  .step { display: flex; align-items: center; gap: 24px; font-size: 38px; font-weight: 500; padding: 16px 0; }
  .ck { width: 44px; height: 44px; border-radius: 50%; background: #0064E0; color: #fff; font-size: 28px; display: grid; place-items: center; font-weight: 700; }
  .ask { margin-top: 30px; padding: 34px 38px; border-radius: 28px; background: #fff; border: 3px solid #0064E0; box-shadow: 0 10px 30px rgba(0, 60, 140, 0.12); }
  .ask p { font-size: 40px; font-weight: 700; }
  .ask small { display: block; margin-top: 8px; font-size: 30px; color: #6B7785; }
  .btns { display: flex; gap: 18px; margin-top: 26px; }
  .btn { font-size: 32px; font-weight: 700; padding: 16px 38px; border-radius: 999px; background: #0064E0; color: #fff; }
  .btn.ghost { background: #E8EEF6; color: #1C2B39; }
</style></head><body>
  <h1>Fall launch: campaign plan</h1>
  <p class="sub">Worked on it for 3 h while you were away</p>
  <div class="step"><span class="ck">✓</span>Read last quarter’s results</div>
  <div class="step"><span class="ck">✓</span>Wrote 12 ad versions</div>
  <div class="step"><span class="ck">✓</span>Built the email sequence</div>
  <div class="ask"><p>Ready to schedule 40 emails</p><small>Needs your OK before anything goes out</small>
    <div class="btns"><span class="btn">Approve</span><span class="btn ghost">Review</span></div></div>
</body></html>
